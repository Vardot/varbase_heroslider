langcode: en
status: true
dependencies:
  config:
    - node.type.varbase_heroslider
  module:
    - content_moderation
id: varbase_simple_workflow
label: Simple
type: content_moderation
type_settings:
  states:
    archived:
      label: 'Archived / Unpublished'
      weight: 1
      published: false
      default_revision: true
    draft:
      label: Draft
      weight: -1
      published: false
      default_revision: false
    published:
      label: Published
      weight: 0
      published: true
      default_revision: true
  transitions:
    archive:
      label: 'Archive / Unpublish'
      from:
        - published
      to: archived
      weight: 1
    create_new_draft:
      label: 'Create new draft'
      from:
        - archived
        - draft
        - published
      to: draft
      weight: -1
    publish:
      label: Publish
      from:
        - draft
        - published
      to: published
      weight: 0
  entity_types:
    node:
      - varbase_heroslider
