name: 'Varbase Hero Slider Test Roles'
description: 'Creates the Varbase user roles (site_admin, content_admin, editor, seo_admin) that the Varbase Media and Varbase Hero Slider default recipes grant permissions to. On a full Varbase site these roles are provided by the Varbase profile; the Varbase Hero Slider automated tests run on the Drupal Standard profile, so this helper recipe creates minimal role entities from its own config/ directory before the Varbase Media and Varbase Hero Slider modules are installed.'
type: 'Testing'
install:
  - user
