################################################################################
# GitLab CI for the Varbase Hero Slider module (1.1.x line - Drupal ~11.4).
#
# Two halves:
#   1. The standard Drupal CI validation jobs (composer-lint, cspell, eslint,
#      phpcs, phpstan, stylelint) provided by the drupalci templates. Every
#      validate job gates strictly (allow_failure:false).
#   2. A webship-js BDD browser-test job (Playwright + Cucumber-js) that runs
#      the tests/features/drupal/** suite against a freshly installed Drupal
#      Standard site provisioned by installing Varbase Hero Slider (which pulls
#      in the Varbase Media stack and its own default recipe), granting the
#      Webmaster super-admin every route.
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # The 1.1.x branch targets Drupal core 11.4 only. Pin the core version and
  # ignore the project's info.yml core_version_requirement when resolving it.
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  # Make every drupalci validate job blocking (stylelint et al. default to
  # allow_failure:true). Combined with the per-job allow_failure:false overrides
  # below, the whole pipeline gates strictly.
  _ALL_VALIDATE_ALLOW_FAILURE: "0"
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is relied upon in CI; Yarn 4 defaults to immutable installs and
  # would refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# = Validate stage (all blocking) =
# Force EVERY drupalci validate job to gate. _ALL_VALIDATE_ALLOW_FAILURE=0
# flips the template default (stylelint and a few others default to
# allow_failure:true) to blocking; the explicit per-job overrides below make the
# intent unmissable and cover jobs that read their own _*_ALLOW_FAILURE var.
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
stylelint:
  allow_failure: false

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - webship-js's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = webship-js BDD - Drupal Standard profile + Varbase Hero Slider install =
webship-js-test:
  extends: .testing-job-base
  needs: [composer]
  # Installing Varbase Hero Slider pulls in the whole Varbase Media stack
  # (media, entity browsers, DS, Blazy, Slick, Focal Point, drimage_improved),
  # so allow more than the default 30-minute job wall-clock.
  timeout: 2h
  # Only the database service is needed. Playwright bundles its own Chromium,
  # so Selenium and chromedriver are not required.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  before_script:
    - !reference [.fragments, web_db]
    - git config --global --add safe.directory "$CI_PROJECT_DIR" || true
    # Varbase Media config (a Hero Slider dependency) sets the image toolkit to
    # ImageMagick. Install the ImageMagick CLI + WebP delegate so image
    # derivative generation during the test install does not fatal (GD stays
    # available as a fallback). webp is a best-effort extra; ignore it if the
    # package index does not carry it.
    - apt-get update -y > /dev/null || true
    - apt-get install -y --no-install-recommends imagemagick > /dev/null || true
    - apt-get install -y --no-install-recommends webp > /dev/null || true
    # Drupal core 11.4.0 (released 2026-07-01) is not yet installable through the
    # drupal.org Composer facade used by CI, so the composer job resolves to the
    # latest available 11.3.x. The static jobs (phpcs, phpstan, composer-lint)
    # validate the 11.4 target directly; this browser job verifies the module's
    # runtime behavior on the closest installable core. Relax the checked-out
    # module info.yml core_version_requirement for the test site only (this does
    # NOT change the committed ~11.4.0 requirement) so the module can enable.
    - |
      for SCAN in "$CI_PROJECT_DIR" "$CI_PROJECT_DIR/$_WEB_ROOT"; do
        find "$SCAN" -name '*.info.yml' -print0 2>/dev/null \
          | xargs -0 -r sed -i -E 's/core_version_requirement:[[:space:]]*~11\.4\.0/core_version_requirement: ^11.3 || ^11.4/'
      done
    # The released Varbase Media (drupal/varbase_media ~10.1.0 pulled from the
    # Composer facade) still declares `configure: varbase_media.settings` in its
    # varbase_media.info.yml, but ships no such route/settings form on 10.1.x.
    # Building the configure link during install fatals with
    # "Route varbase_media.settings does not exist". This is already fixed on the
    # varbase_media 10.1.x fork but not yet in a tagged release, so strip the
    # dangling configure key from the checked-out module for the test site only
    # (this does NOT touch this module's committed sources).
    - |
      find "$CI_PROJECT_DIR/$_WEB_ROOT" -name 'varbase_media.info.yml' -print0 2>/dev/null \
        | xargs -0 -r sed -i -E '/^configure:[[:space:]]*varbase_media\.settings[[:space:]]*$/d'
    - cd $CI_PROJECT_DIR
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd
        --site-name="Varbase Hero Slider Test" -y
    # Pre-install drimage_improved (a hard Varbase Media dependency) with its own
    # container rebuild BEFORE the Varbase Media stack installs. Applying the
    # whole media stack in one pass otherwise references the
    # drimage_improved.image_style_repository service via a config event
    # subscriber before the container is rebuilt, which fatals with
    # "non-existent service". Installing it first fully registers the service.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install image drimage_improved -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Create the Varbase editorial roles (site_admin, content_admin, editor,
    # seo_admin) that the Varbase Media and Varbase Hero Slider default recipes
    # grant permissions to. On a full Varbase site the profile provides them; on
    # the Standard test profile they must exist first, otherwise the recipes'
    # grantPermissions on those roles fail.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe
        $CI_PROJECT_DIR/tests/recipes/varbase_heroslider_test_roles -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Provision Varbase Media first (its hook_install imports media types, entity
    # browsers and views in the correct order and applies its own default
    # recipe). Installing the module directly (rather than a drush recipe) avoids
    # the core Recipe runner's checkpoint transaction, which fatals while rolling
    # back on the first non-fatal config warning.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_media -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Pre-install the modules the Varbase Hero Slider default recipe would
    # install. Varbase Hero Slider only declares varbase_media and
    # varbase_components in its info.yml dependencies, but its config/install
    # objects (entityqueue.entity_queue.varbase_heroslider, the field_link field
    # storage, ...) depend on entityqueue, link and friends being enabled first.
    # On a full Varbase profile these modules are already present; on the Standard
    # test profile they must be enabled BEFORE the module's config/install is
    # imported, otherwise the install fatals with an UnmetDependenciesException.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install
        link menu_ui entityqueue rabbit_hole field_group length_indicator
        advanced_text_formatter maxlength -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Provision Varbase Hero Slider. Its hook_install applies the recipes/default
    # recipe (which now finds those modules already enabled), imports the Hero
    # Slider content type, fields and view, and grants Hero Slider permissions to
    # the editorial roles created above. The Webmaster super-admin reaches every
    # route, so no extra grants are needed for the scenarios.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_heroslider -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Complete the Hero Slider content type on the Standard test profile.
    #
    # The module ships its default form and view displays in config/optional.
    # Those displays declare a config dependency on the Varbase Simple
    # content-moderation workflow (workflows.workflow.varbase_simple_workflow),
    # which on a full Varbase site is provided by the profile but does NOT exist
    # on the Drupal Standard profile. Core also imports a module's config/optional
    # during installDefaultConfig - before the module's hook_install recipe
    # creates the Hero Slider field instances - so on Standard those displays are
    # skipped as having unmet dependencies and the Hero Slider fields end up
    # hidden on the add form and node view (only the Title shows).
    #
    # Recreate the missing workflow (moderating the Hero Slider type) via the
    # tests/varbase_heroslider_test_workflow helper recipe, then re-run the
    # optional configuration import: with the workflow present and the field
    # instances already created, the default form display (media library widget,
    # moderation state) and the view displays (brief + media) now apply - so the
    # site matches a real Varbase install and the scenarios exercise the real
    # widgets and rendering.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe
        $CI_PROJECT_DIR/tests/recipes/varbase_heroslider_test_workflow -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval '\Drupal::service("config.installer")->installOptionalConfig();'
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Create the "Editor" test account used by the create-slide and access
    # scenarios. It is a member of the `editor` role, which the default recipe
    # grants "create varbase_heroslider content" and "update varbase_heroslider
    # entityqueue". On a full Varbase site the profile seeds this account; on
    # the Standard test profile it must be created after the roles exist. The
    # credentials mirror cucumber.js worldParameters.users.Editor.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "Editor" --mail="test.editor@vardot.com" --password="dD.123123ddd" -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add "editor" "Editor" -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Create deterministic Hero Slider content (image media + two slides) via the
    # varbase_heroslider_test_content testing recipe, then the browser scenarios
    # only verify it. This avoids driving the flaky Media library upload dialog.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/tests/recipes/varbase_heroslider_test_content -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.js loads only tests/features/drupal/**. Disable webship-js's auto
    # HTML hook and run generate-reports explicitly so HTML + PDF land next to
    # the JSON in tests/reports/.
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  allow_failure: false

# Allow the Varbase stack Composer plugins in the CI build (allow-plugins lives
# in varbase_project, not modules).
composer:
  before_script:
    - composer config --no-plugins allow-plugins.symfony/runtime true || true
    - composer config --no-plugins allow-plugins.composer/installers true || true
    - composer config --no-plugins allow-plugins.cweagans/composer-patches true || true
    - composer config --no-plugins allow-plugins.oomphinc/composer-installers-extender true || true
    - composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true || true
    - composer config --no-plugins allow-plugins.drupal/core-project-message true || true
    - composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true || true
    - composer config --no-plugins allow-plugins.phpstan/extension-installer true || true
    - composer config --no-plugins allow-plugins.php-http/discovery true || true
    - composer config --no-plugins allow-plugins.tbachert/spi true || true
    - composer config --no-plugins allow-plugins.vardot/varbase-patches true || true
    - composer require --no-update vardot/varbase-patches:~10.1.0
