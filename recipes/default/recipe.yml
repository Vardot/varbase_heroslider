name: Varbase Hero Slider - Default
description: A recipe to install the Varbase Hero Slider content type, its fields, displays, view and editorial permissions, and every module it needs. The varbase_heroslider module itself declares no dependencies and installs nothing; this recipe owns the whole install.
type: install
install:
  # Core / base modules the Hero Slider config relies on.
  - node
  - user
  - path
  - file
  - media
  # Contrib modules the content type, fields and displays depend on.
  - link
  - menu_ui
  - entityqueue
  - rabbit_hole
  - field_group
  - length_indicator
  - advanced_text_formatter
  - maxlength
  - content_moderation
  - inline_entity_form
  - entity_browser_entity_form
  - media_library
  - media_library_edit
  - ds
  - layout_builder
  - ui_patterns
  - ui_patterns_field_formatters
  - ui_patterns_views
  - drimage_improved
  # Varbase stack that provides the media types and Hero Slider components.
  - varbase_media
  - varbase_components
config:
  actions:
    user.role.editor:
      grantPermissions:
        - 'create varbase_heroslider content'
        - 'edit own varbase_heroslider content'
        - 'delete own varbase_heroslider content'
        - 'update varbase_heroslider entityqueue'
        - 'view varbase_heroslider revisions'
    user.role.content_admin:
      grantPermissions:
        - 'create varbase_heroslider content'
        - 'edit own varbase_heroslider content'
        - 'delete own varbase_heroslider content'
        - 'edit any varbase_heroslider content'
        - 'delete any varbase_heroslider content'
        - 'update varbase_heroslider entityqueue'
        - 'view varbase_heroslider revisions'
        - 'revert varbase_heroslider revisions'
    user.role.site_admin:
      grantPermissions:
        - 'create varbase_heroslider content'
        - 'edit own varbase_heroslider content'
        - 'delete own varbase_heroslider content'
        - 'edit any varbase_heroslider content'
        - 'delete any varbase_heroslider content'
        - 'update varbase_heroslider entityqueue'
        - 'view varbase_heroslider revisions'
        - 'revert varbase_heroslider revisions'
